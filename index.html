<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanitarian Emergency Helper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>

    <h1>Humanitarian Aid Assistant</h1>

     <div class="card">
        <h2>Mappa Zone Operative e Aiuti</h2>
        <div id="map" style="height: 400px; width: 100%; border-radius: 8px;"></div>
    </div>

    <!-- modulo 1: calcolo fabbisogno acqua -->
    <div class="card">
        <h2>1. Calcolo Fabbisogno Acqua</h2>
        <label for="numPersone">Numero di persone:</label>
        <input type="number" id="numPersone" placeholder="Es. 50">

        <label for="numGiorni">Numero di giorni:</label>
        <input type="number" id="numGiorni" placeholder="Es. 3">

        <button onclick="gestisciCalcoloAcqua()">Calcola Acqua Necessaria</button>
        <div id="risultatoAcqua" class="result" style="display:none;"></div>
    </div>

    <!-- modulo 2: Triage sanitario (temperatura)-->
    <div class="card">
        <h2>2. Triage Temperatura Paziente</h2>
        <label for="tempPaziente">Temperatura (°C):</label>
        <input type="number" step="0.1" id="tempPaziente" placeholder="Es. 38.2">

        <button onclick="gestisciTriage()">Valuta Condizione</button>
        <div id="risultatoTriage" class="result" style="display:none;"></div>
    </div>

    <!--modulo 3: RAZIONI CIBO-->
    <div class="card">
        <h2>3. Calcolo Razioni Cibo</h2>
        <label for="numPersoneCibo">Numero di persone:</label>
        <input type="number" id="numPersoneCibo" placeholder="Es. 50">

        <label for="numGiorniCibo">Numero di giorni:</label>
        <input type="number" id="numGiorniCibo" placeholder="Es. 10">

        <button onclick="gestisciCalcoloCibo()">Calcola Razioni</button>
        <div id="risultatoCibo" class="result" style="display: none;"></div>
    </div>

     <!--modulo 4: calcolo tende/rifugi necessari-->
     <div class="card">
        <h2>4. Calcolo Tende e rifugi</h2>
        <label for="numSfollati">Numero di sfollati/persone da ospitare:</label>
        <input type="number" id="numSfollati" placeholder="Es. 120">

        <button onclick="gestisciCalcoloRifugi()">Calcola Rifugi</button>
        <div id="risultatoRifugi" class="result" style="display: none;"></div>
     </div>

     <!--modulo 5: calcolo strade percorribili-->
     <div class="card">
        <h2>5. Calcolo Strade Percorribili</h2>
        <label for="nameStrade">Scegli una strada</label>
        <select id="nameStrade">
            <option value="">-- Seleziona una strada --</option>
            <option value="Al-Rashid Street">Al-Rashid Street</option>
            <option value="Omar Mukhtar Street">Omar Mukhtar Street</option>
            <option value="Salah al-Din Road">Salah al-Din Road</option>
        </select>

        <button onclick="gestisciCalcoloStrade()">Calcola Strade</button>
        <div id="risultatoStrade" class="result" style="display: none;"></div>
     </div>

    <!-- collegamento al file JavaScript esterno -->
    <script src="script.js"></script>

    <footer class="main-footer">
        <p>&copy; 2026 Francesca Sassi. Tutti i diritti riservati.</p> // &copy è il modo in HTML di scrivere Copyright
    </footer>
</body>
</html>
